# stop closing at the end of video
keep-open=always

# OSC behaviour and scaling
osc=no

# disable title-bar
title-bar=no

# title: "${media-title}" or "${filename}"
title=${media-title}

# circumvent subtitle or OSD bad positioning when watch later options are used
watch-later-options-remove=sub-pos
watch-later-options-remove=osd-margin-y
