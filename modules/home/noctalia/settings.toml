config_version = 13

[accessibility]
ui_scale = 1.1000000089406967

[bar.default]
background_opacity = 0.64999998547136784
capsule = true
capsule_border = "primary"
capsule_foreground = "primary"
center = [ "group:g3" ]
end = [ "recorder", "todo", "nix-monitor", "group:g1", "group:g2" ]
font_family = "Maple Mono NF"
margin_edge = 0
margin_ends = 20
padding = 6
panel_overlap = 0
radius = 20
radius_top_left = 8
radius_top_right = 8
scale = 1.1000000000000001
shadow = false
start = [ "workspaces", "media", "audio_visualizer" ]

    [[bar.default.capsule_group]]
    border = "primary"
    enabled = true
    fill = "surface_variant"
    foreground = "primary"
    id = "g1"
    members = [ "temp", "cpu", "ram", "sysmon" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    border = "primary"
    enabled = true
    fill = "surface_variant"
    foreground = "primary"
    id = "g2"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    border = "primary"
    enabled = true
    fill = "surface_variant"
    foreground = "primary"
    id = "g3"
    members = [ "tray", "notifications", "clock", "cat" ]
    opacity = 1.0
    padding = 6.0

[brightness]
enable_ddcutil = true

[control_center]
sidebar_section = "none"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "dark_mode"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "audio"

    [[control_center.shortcuts]]
    type = "notification"

[desktop_widgets]
schema_version = 1
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
background_opacity = 0.65000000000000002
enabled = true
icon_size = 35
inactive_opacity = 0.59999998658895493
item_spacing = 8
reserve_space = false
shadow = false
show_dots = true
show_instance_count = false

[hooks]
started = ""

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[keybinds]
cancel = [ "Delete", "Escape" ]

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.0
wallpaper = "/home/wyn/Pictures/Wallpapers/Embraced_A.png"

[lockscreen_widgets]
enabled = true
schema_version = 1
widget_order = [
    "lockscreen-login-box@DP-2",
    "lockscreen-login-box@DP-5",
