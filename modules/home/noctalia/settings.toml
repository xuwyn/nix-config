[plugin_settings."noctalia/notes"]
panel_open_near_click = true

[plugin_settings."yocraft/web-launcher"]
icon_provider = "duckduckgo"
links = [
    "Noctalia|https://docs.noctalia.dev/v5/",
    "DankMaterialShell|https://danklinux.com/docs/",
    "GitHub|https://github.com",
    "GitLab|https://gitlab.com",
    "Codeberg|https://codeberg.org",
    "YouTube|https://youtube.com"
]

[plugins]
enabled = [
    "noctalia/screen_recorder",
    "noctalia/wallhaven",
    "noctalia/bongocat",
    "noctalia/notes",
    "noctalia/kaomoji",
    "noctalia/translator",
    "avivbintangaringga/nix-monitor",
    "nightwatch75/todo",
    "yocraft/web-launcher"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
date_format = "%A, %Y %b %d"
font_family = "Maple Mono NF"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.panel]
    control_center_placement = "attached"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"
    wallpaper_placement = "attached"

    [shell.screen_corners]
    enabled = true
    size = 40

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl reboot --firmware-setup"
    countdown_seconds = 0.0
    enabled = true
    glyph = "cpu"
    label = "UEFI Reboot"
    shortcut = "5"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "6"
    variant = "destructive"

[system.monitor]
cpu_poll_seconds = 1
network_poll_seconds = 1

[theme]
builtin = "Ayu"
custom_palette = "m3-content"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "ghostty", "hyprland", "kitty", "niri", "qt" ]
    community_ids = [ "pywalfox", "discord", "zed" ]

        [theme.templates.user.nvim-base16]
        input_path = "~/.config/nvim/lua/matugen-template.lua"
        output_path = "~/.config/nvim/lua/matugen.lua"
        post_hook = "pkill -SIGUSR1 nvim"

[wallpaper]
directory = "/home/wyn/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/wyn/Pictures/Wallpapers/Embraced_A.png"

    [wallpaper.last]
    path = "/home/wyn/Pictures/Wallpapers/Embraced_A.png"

    [wallpaper.monitors.DP-2]
    path = "/home/wyn/Pictures/Wallpapers/Embraced_A.png"

    [wallpaper.monitors.DP-5]
    path = "/home/wyn/Pictures/Wallpapers/Embraced_A.png"

[widget.audio_visualizer]
centered = false
width = 100.0

[widget.cat]
audio_spectrum = true
scale = 1.45
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.media]
hide_when_no_media = true
title_scroll = "always"

[widget.network]
show_label = false

[widget.nix-monitor]
show_text = false
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.sysmon]
stat = "disk_used_pct"

[widget.todo]
type = "nightwatch75/todo:todo"

[widget.tray]
drawer = true
hidden = [ "network", "blueman" ]