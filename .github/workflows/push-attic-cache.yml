name: cache push

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ATTIC_ENDPOINT: https://puffin.tail9fb2b9.ts.net
  ATTIC_SERVER: tailscale
  ATTIC_CACHE: main
  ATTIC_JOBS: "2"
  NIX_EXTRA_CONFIG: |
    extra-substituters = https://puffin.tail9fb2b9.ts.net/main
    extra-trusted-public-keys = main:AOInzGo25vK/CX+//GtecGc5zoePljsTyLki/rliiS8=
    accept-flake-config = true
    access-tokens = github.com=${{ secrets.GITHUB_TOKEN }} gitlab.com=PAT:${{ secrets.GITLAB_TOKEN }}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Generate CI matrix
        id: discover
        run: |
          set -Eeuo pipefail
          matrix="$(nix eval --json .#ciMatrix | jq -c '
            {"x86_64-linux": "ubuntu-latest",
             "aarch64-linux": "ubuntu-24.04-arm",
             "x86_64-darwin": "macos-13",
             "aarch64-darwin": "macos-latest"} as $os |
            {include: map(. + {os: $os[.system]})}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq -r '.include[] | "  \(.name) (\(.system))"' <<< "$matrix"

  build:
    name: ${{ matrix.name }} (${{ matrix.system }})
    needs: discover
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: ${{ env.NIX_EXTRA_CONFIG }}

      - name: Attic login
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -Eeuo pipefail
          nix profile add --inputs-from . nixpkgs#attic-client
          attic login "$ATTIC_SERVER" "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"

      - name: Evaluate
        id: eval
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -Eeuo pipefail
          attr='.#ciChecks."${{ matrix.system }}"."${{ matrix.name }}"'
          eval="$(nix eval --json "$attr" --apply 'd: { drv = d.drvPath; out = d.outPath; }')"
          drv="$(jq -r '.drv' <<< "$eval")"
          out="$(jq -r '.out' <<< "$eval")"

          echo "drv=$drv" >> "$GITHUB_OUTPUT"

          if nix path-info \
               --store "$ATTIC_ENDPOINT/$ATTIC_CACHE" \
               --option access-tokens "$ATTIC_ENDPOINT=$ATTIC_TOKEN" \
               "$out" &>/dev/null; then
            echo "$out already cached, skipping build"
            echo "cached=true" >> "$GITHUB_OUTPUT"
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.eval.outputs.cached == 'false'
        run: nix build -L --no-link '${{ steps.eval.outputs.drv }}^*'

      - name: Push to Attic cache
        id: push
        if: steps.eval.outputs.cached == 'false'
        continue-on-error: true
        env:
          DRV: ${{ steps.eval.outputs.drv }}
        run: |
          set -Eeuo pipefail
          outs=()
          while IFS= read -r out; do
            outs+=("$out")
          done < <(nix build --no-link --print-out-paths "$DRV^*")

          push() {
            for attempt in 1 2 3; do
              if attic push --jobs "$ATTIC_JOBS" "$@"; then
                return 0
              fi
              echo "::warning::attic push failed (attempt $attempt/3)"
              sleep $((attempt * 30))
            done
            return 1
          }

          push --no-closure "$ATTIC_CACHE" "$DRV"
          push "$ATTIC_CACHE" "${outs[@]}"

      - name: Report cache push failure
        if: always() && steps.push.outcome == 'failure'
        run: |
          echo "::warning title=Cache push failed::${{ matrix.name }} (${{ matrix.system }}) built successfully but the cache push failed after 3 attempts"
          echo "⚠️ **${{ matrix.name }} (${{ matrix.system }})** built successfully but the cache push failed after 3 attempts." >> "$GITHUB_STEP_SUMMARY"
